# Instagram Chat Plugin Bot Configuration

# Email notifications (optional)
email:
  enabled: true  # Set to false to disable email
  # Recipient can be a single email or list of emails
  recipient: "qq835490396@gmail.com"
  # For multiple recipients, use list format:
  # recipient:
  #   - "email1@gmail.com"
  #   - "email2@gmail.com"
  #   - "email3@gmail.com"
  smtp_server: "smtp.gmail.com"  # Gmail SMTP server
  smtp_port: 587  # TLS port

rotation:
  # Start date for week 1 (YYYY-MM-DD format)
  # Weeks run Mon-Sun, labeled by ending Sunday
  # Week 1: Feb 23 - Mar 1  ("Mar 1 schedule")
  # Week 2: Mar 2  - Mar 8  ("Mar 8 schedule")
  # Week 3: Mar 9  - Mar 15 ("Mar 15 schedule")
  # Week 4: Mar 16 - Mar 22 ("Mar 22 schedule")
  # Week 5: Mar 23 - Mar 29 ("Mar 29 schedule")
  start_date: "2026-02-23"

  # List of participants (1-8 people)
  # Order matters: rotation cycles through this list
  # If < 5 people: everyone stays in one group
  # If >= 5 people: splits into main group (n-1) and solo person (rotates weekly)
  # Week 1 (Mar 1):  Eldon solo
  # Week 2 (Mar 8):  Jack solo
  # Week 3 (Mar 15): Jin solo
  # Week 4 (Mar 22): Joe solo
  # Week 5 (Mar 29): Sean solo
  participants:
    - "Eldon"
    - "Jack"
    - "Jin"
    - "Joe"
    - "Sean"

  # Optional: List people who are unavailable THIS WEEK ONLY
  # Leave empty [] if everyone is available
  unavailable_this_week: []

  # Scheduled unavailability: automatically marks people out on specific training Sundays
  scheduled_unavailable:
    - participant: "Joe"
      dates:
        - "2026-04-19"
        - "2026-04-26"
        - "2026-05-03"

message:
  # Template for when there's only 1 group (< 5 participants)
  single_group_template: |
    📅 {training_date} - All Together!

    👥 Team: {all_members}

    Have a great week!

  # Template for when there are 2 groups (>= 5 participants)
  split_group_template: |
    📅 {training_date} Rotation

    🏢 Main Group: {main_group}
    🌟 Solo: {solo_person}

    Have a great week!
